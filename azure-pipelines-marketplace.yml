name: marketplace-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

jobs:
  - job: PublishMarketplace
    displayName: 'Publicar extensiones en el Marketplace'
    steps:
      - checkout: self
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.x'
      - script: python3 tools/packageExtension.py
        displayName: 'Empaquetar los .vsix'
      - script: |
          set -euo pipefail
          if [ -z "${AZURE_DEVOPS_EXT_PAT:-}" ]; then
            echo "MarketplacePat no llegó al script. La variable del pipeline debe llamarse MarketplacePat."
            exit 1
          fi
          echo "Token recibido (${#AZURE_DEVOPS_EXT_PAT} caracteres)."
          shopt -s nullglob
          files=(dist/*.vsix)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No se generó ningún .vsix en dist/."
            exit 1
          fi
          for vsix in "${files[@]}"; do
            echo "Publicando $vsix"
            output="$(npx --yes tfx-cli@0.21.1 extension publish \
              --vsix "$vsix" \
              --token "$AZURE_DEVOPS_EXT_PAT" \
              --share-with performance-quality-gate \
              --no-wait-validation \
              </dev/null 2>&1)"
            printf '%s\n' "$output"
            if ! printf '%s\n' "$output" | grep -qi 'published extension\|Completed operation'; then
              echo "tfx terminó sin confirmar la publicación de $vsix."
              exit 1
            fi
          done
        displayName: 'Publicar en el Marketplace'
        env:
          AZURE_DEVOPS_EXT_PAT: $(MarketplacePat)
