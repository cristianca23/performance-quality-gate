name: release-${{ parameters.version }}-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

parameters:
  - name: version
    displayName: Cambio a evaluar
    type: string
    default: A
    values:
      - A
      - B
  - name: warmupSeconds
    displayName: Segundos de estabilización
    type: number
    default: 60
  - name: maxP95RegressionPct
    displayName: Aumento máximo del p95 frente a producción (%)
    type: number
    default: 20
  - name: maxErrorIncreasePp
    displayName: Aumento máximo de error (porcentaje)
    type: number
    default: 1
  - name: maxErrorRatePct
    displayName: Tope de error (%)
    type: number
    default: 2
  - name: minSamples
    displayName: Mínimo de muestras para el análisis
    type: number
    default: 30
  - name: endpointsJson
    displayName: Límites por endpoint (JSON)
    type: string
    default: '{}'

pool:
  vmImage: ubuntu-latest

jobs:
  - job: QualityGate
    displayName: 'Evaluar versión ${{ parameters.version }}'
    steps:
      - checkout: self
      - template: .azuredevops/templates/performance-gate.yml
        parameters:
          baseline: $(Build.SourcesDirectory)/data/produccion-actual.csv
          candidate: $(Build.SourcesDirectory)/data/version-${{ lower(parameters.version) }}.csv
          report: $(Build.SourcesDirectory)/artifacts/version-${{ lower(parameters.version) }}.md
          htmlReport: $(Build.SourcesDirectory)/artifacts/version-${{ lower(parameters.version) }}.html
          warmupSeconds: ${{ parameters.warmupSeconds }}
          maxP95RegressionPct: ${{ parameters.maxP95RegressionPct }}
          maxErrorIncreasePp: ${{ parameters.maxErrorIncreasePp }}
          maxErrorRatePct: ${{ parameters.maxErrorRatePct }}
          minSamples: ${{ parameters.minSamples }}
          endpointsJson: ${{ parameters.endpointsJson }}
      - script: |
          REPORT="$(Build.SourcesDirectory)/artifacts/version-${{ lower(parameters.version) }}.md"
          if [ -f "$REPORT" ]; then
            echo "##vso[task.uploadsummary]$REPORT"
          fi
        displayName: 'Visualizar reporte'
        condition: always()
      - task: PublishPipelineArtifact@1
        displayName: 'Publicar reporte de versión ${{ parameters.version }}'
        condition: always()
        inputs:
          targetPath: $(Build.SourcesDirectory)/artifacts
          artifact: reporte-version-${{ lower(parameters.version) }}
      - task: PublishHtmlTab@1
        displayName: 'Publicar reporte HTML'
        condition: always()
        inputs:
          reportDir: $(Build.SourcesDirectory)/artifacts/version-${{ lower(parameters.version) }}.html
          tabName: Quality gate ${{ parameters.version }}
