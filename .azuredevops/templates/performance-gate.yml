parameters:
  - name: baseline
    type: string
  - name: candidate
    type: string
  - name: report
    type: string
  - name: htmlReport
    type: string
  - name: baselineFormat
    type: string
    default: jmeter
  - name: candidateFormat
    type: string
    default: jmeter
  - name: warmupSeconds
    type: string
  - name: maxP95RegressionPct
    type: string
  - name: maxErrorIncreasePp
    type: string
  - name: maxErrorRatePct
    type: string
  - name: minSamples
    type: string
  - name: endpointsJson
    type: string
    default: '{}'

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.x'
    displayName: 'Seleccionar Python'

  - task: PerfGate@1
    displayName: 'Comparar performance contra producción'
    inputs:
      baseline: ${{ parameters.baseline }}
      candidate: ${{ parameters.candidate }}
      baselineFormat: ${{ parameters.baselineFormat }}
      candidateFormat: ${{ parameters.candidateFormat }}
      warmupSeconds: ${{ parameters.warmupSeconds }}
      maxP95RegressionPct: ${{ parameters.maxP95RegressionPct }}
      maxErrorIncreasePp: ${{ parameters.maxErrorIncreasePp }}
      maxErrorRatePct: ${{ parameters.maxErrorRatePct }}
      minSamples: ${{ parameters.minSamples }}
      endpointsJson: ${{ parameters.endpointsJson }}
      report: ${{ parameters.report }}
      htmlReport: ${{ parameters.htmlReport }}
