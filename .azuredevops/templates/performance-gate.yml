parameters:
  - name: baseline
    type: string
  - name: candidate
    type: string
  - name: report
    type: string
  - name: htmlReport
    type: string
  - name: baselineFormat
    type: string
    default: jmeter
    values:
      - jmeter
      - k6
  - name: candidateFormat
    type: string
    default: jmeter
    values:
      - jmeter
      - k6
  - name: warmupSeconds
    type: number
  - name: maxP95RegressionPct
    type: number
  - name: maxErrorIncreasePp
    type: number
  - name: maxErrorRatePct
    type: number
  - name: minSamples
    type: number

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.x'
    displayName: 'Seleccionar Python'

  - script: |
      python tools/perfGate.py \
        --baseline "${{ parameters.baseline }}" \
        --candidate "${{ parameters.candidate }}" \
        --baseline-format "${{ parameters.baselineFormat }}" \
        --candidate-format "${{ parameters.candidateFormat }}" \
        --config perf-gate.json \
        --warmup-seconds "${{ parameters.warmupSeconds }}" \
        --max-p95-regression-pct "${{ parameters.maxP95RegressionPct }}" \
        --max-error-increase-pp "${{ parameters.maxErrorIncreasePp }}" \
        --max-error-rate-pct "${{ parameters.maxErrorRatePct }}" \
        --min-samples "${{ parameters.minSamples }}" \
        --report "${{ parameters.report }}" \
        --html-report "${{ parameters.htmlReport }}"
    displayName: 'Comparar performance contra producción'
