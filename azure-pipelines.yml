name: ${{ parameters.version }}-$(Date:yyyyMMdd)$(Rev:.r)

parameters:
  - name: version
    displayName: Cambio a evaluar
    type: string
    default: A
    values:
      - A
      - B

trigger:
  - main

pool:
  vmImage: ubuntu-latest

jobs:
  - job: UnitTests
    displayName: 'Pruebas del quality gate'
    steps:
      - checkout: self
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.x'
      - script: python -m unittest discover -s tests -v
        displayName: 'Ejecutar pruebas unitarias'

  - job: Evaluate
    displayName: 'Evaluar versión ${{ parameters.version }}'
    dependsOn: UnitTests
    steps:
      - checkout: self
      - template: .azuredevops/templates/performance-gate.yml
        parameters:
          baseline: data/produccion-actual.csv
          candidate: data/version-${{ lower(parameters.version) }}.csv
          report: $(Build.SourcesDirectory)/artifacts/version-${{ lower(parameters.version) }}.md
          htmlReport: $(Build.SourcesDirectory)/artifacts/version-${{ lower(parameters.version) }}.html
      - script: |
          REPORT="$(Build.SourcesDirectory)/artifacts/version-${{ lower(parameters.version) }}.md"
          if [ -f "$REPORT" ]; then
            echo "##vso[task.uploadsummary]$REPORT"
          fi
        displayName: 'Visualizar reporte'
        condition: always()
      - task: PublishPipelineArtifact@1
        displayName: 'Publicar reportes de versión ${{ parameters.version }}'
        condition: always()
        inputs:
          targetPath: $(Build.SourcesDirectory)/artifacts
          artifact: reporte-version-${{ lower(parameters.version) }}
      - task: PublishHtmlTab@1
        displayName: 'Publicar reporte HTML'
        condition: always()
        inputs:
          reportDir: $(Build.SourcesDirectory)/artifacts/version-${{ lower(parameters.version) }}.html
          tabName: Quality gate ${{ parameters.version }}