name: validator-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  - main

pool:
  vmImage: ubuntu-latest

jobs:
  - job: UnitTests
    displayName: 'Pruebas del quality gate'
    steps:
      - checkout: self
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.x'
      - script: python -m unittest discover -s tests -v
        displayName: 'Ejecutar pruebas unitarias'
      - script: |
          mkdir -p "$(Build.ArtifactStagingDirectory)/validator"
          cp -R tools data "$(Build.ArtifactStagingDirectory)/validator/"
          cp perf-gate.json "$(Build.ArtifactStagingDirectory)/validator/"
        displayName: 'Empaquetar validador'
      - publish: $(Build.ArtifactStagingDirectory)/validator
        artifact: validator
        displayName: 'Publicar artefacto del validador'
