name: validator-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  - main
  - trunk

pool:
  vmImage: ubuntu-latest

jobs:
  - job: BuildTask
    displayName: 'Construir la task'
    steps:
      - checkout: self
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.x'
      - script: python tools/packageExtension.py --output "$(Build.ArtifactStagingDirectory)/extension"
        displayName: 'Empaquetar la task'
      - publish: $(Build.ArtifactStagingDirectory)/extension
        artifact: performance-quality-gate
        displayName: 'Publicar la task'
